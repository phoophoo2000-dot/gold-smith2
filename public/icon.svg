<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="30%" stop-color="#F59E0B" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#292524" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with subtle gold rim -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect x="12" y="12" width="488" height="488" rx="98" fill="none" stroke="#D97706" stroke-width="4" stroke-opacity="0.35" />

  <!-- Outer Ring Coin -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#goldGrad)" stroke-width="20" filter="url(#glow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="6,6" stroke-opacity="0.7" />

  <!-- Center Gold Ingot & Gemstone Motif -->
  <!-- Left Coin -->
  <circle cx="216" cy="256" r="85" fill="#F59E0B" fill-opacity="0.2" stroke="url(#goldGrad)" stroke-width="12" />
  <!-- Right Overlapping Coin -->
  <circle cx="296" cy="256" r="85" fill="#D97706" fill-opacity="0.25" stroke="url(#goldGrad)" stroke-width="12" />

  <!-- Center Diamond Sparkle -->
  <path d="M 256 186 L 274 246 L 334 256 L 274 266 L 256 326 L 238 266 L 178 256 L 238 246 Z" fill="#FEF08A" filter="url(#glow)" />
  <circle cx="256" cy="256" r="16" fill="#FFFBEB" />

  <!-- Four Golden Accent Stars -->
  <circle cx="140" cy="140" r="10" fill="#FDE047" />
  <circle cx="372" cy="140" r="10" fill="#FDE047" />
  <circle cx="140" cy="372" r="10" fill="#FDE047" />
  <circle cx="372" cy="372" r="10" fill="#FDE047" />
</svg>
